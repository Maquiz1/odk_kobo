services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env.prod
    # POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_USER are read directly from .env.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host          # allows pip to reach PyPI during build
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST: db
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"    # reachable via VPS IP from the nginx container
    command: sh -c "python manage.py migrate --noinput && python manage.py setup_roles && python manage.py reparse_schemas && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"

volumes:
  postgres_data:
  media_files:
