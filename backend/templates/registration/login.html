<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ODK Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1565c0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .login-header {
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            border-radius: 1.5rem 1.5rem 0 0;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            color: white;
        }
        .login-icon {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
        }
        .login-body {
            padding: 2.5rem 2rem 2rem;
        }
        .form-control:focus {
            border-color: #1565c0;
            box-shadow: 0 0 0 0.2rem rgba(21, 101, 192, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            letter-spacing: 0.5px;
            border-radius: 0.75rem;
            transition: opacity 0.2s;
        }
        .btn-login:hover { opacity: 0.9; }
        .input-group-text {
            background: #f0f4ff;
            border-right: none;
            color: #1565c0;
        }
        .form-control { border-left: none; }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-box-seam"></i>
            </div>
            <h4 class="mb-1 fw-bold">ODK Management</h4>
            <p class="mb-0 opacity-75 small">Sign in to your account</p>
        </div>
        <div class="login-body">

            {% if form.errors %}
            <div class="alert alert-danger rounded-3 d-flex align-items-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} rounded-3">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-4">
                    <label for="id_username" class="form-label fw-semibold small text-muted text-uppercase">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="username" id="id_username"
                               class="form-control"
                               placeholder="Enter your username"
                               autofocus required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold small text-muted text-uppercase">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" id="id_password"
                               class="form-control"
                               placeholder="Enter your password"
                               required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100 text-white fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-4 text-muted small">
                <i class="bi bi-shield-lock me-1"></i> Secure access — authorised users only
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
